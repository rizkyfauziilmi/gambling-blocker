services:
  redis:
    image: redis:7-alpine
    container_name: gambling-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    env_file:
      - .env
    volumes:
      - redis_data:/data
    command: redis-server --requirepass "${REDIS_PASSWORD:-}"

volumes:
  redis_data:
