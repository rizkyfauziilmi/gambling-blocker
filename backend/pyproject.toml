[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.0",
    "beautifulsoup4>=4.14.3",
    "colorama>=0.4.6",
    "fastapi[standard]>=0.136.3",
    "matplotlib>=3.10.9",
    "minio>=7.2.15",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "playwright>=1.60.0",
    "playwright-stealth>=2.0.3",
    "redis>=5.3.0",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
    "tqdm>=4.67.3",
    "wordcloud>=1.9.6",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["*.ipynb"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ruff>=0.15.15",
]
